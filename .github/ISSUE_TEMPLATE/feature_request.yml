name: Feature / sync-gap request
description: Suggest something to sync, or an improvement to how multiplayer works.
title: "[Idea]: "
labels: ["enhancement"]
body:
  - type: markdown
    attributes:
      value: |
        Check **[What's synced](https://github.com/macery12/oni_multiplayer#whats-synced)** first — the
        **Not synced yet** table already tracks many known gaps.

  - type: textarea
    id: idea
    attributes:
      label: What would you like to see?
      description: Describe the feature, or the thing that should stay in sync but doesn't.
    validations:
      required: true

  - type: textarea
    id: why
    attributes:
      label: Why does it matter for co-op?
      description: How does the current behaviour hurt a shared game?
    validations:
      required: false
